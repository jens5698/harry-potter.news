name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Das Android SDK ist auf den GitHub-Runnern vorinstalliert.
      - name: Android-SDK-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hp-news-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Bei jedem Stand auf main: APK als Release "latest" veröffentlichen,
      # damit sie sich direkt auf dem Handy herunterladen lässt.
      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HP-News.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HP-News.apk --title "Harry Potter News (neueste Version)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}."
